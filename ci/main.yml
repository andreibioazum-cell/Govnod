name: Android Cube APK

"on":
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE.txt"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cube-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build arm64 APK
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          set -o pipefail
          bash scripts/build_apk.sh 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        run: |
          grep -E "error:|ERROR:|Error " build.log | tail -20 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-220)"
          done || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: govnod-cube-arm64-debug-apk
          path: bin/govnod-cube-debug.apk
          retention-days: 30
          if-no-files-found: error
