name: Android Debug APK

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    module_lightmapper_rd_enabled=no
    module_noise_enabled=no
    module_gridmap_enabled=no
    module_csg_enabled=no
    module_navigation_enabled=no
    module_multiplayer_enabled=no
    module_webrtc_enabled=no
    module_websocket_enabled=no
    module_camera_enabled=no
    module_mobile_vr_enabled=no
    module_raycast_enabled=no
    module_vorbis_enabled=no
    module_theora_enabled=no
    module_minimp3_enabled=no
    module_zip_enabled=no
    module_squish_enabled=no
    module_basis_universal_enabled=no
    module_gltf_enabled=no
    linker=mold
    debug_symbols=no
    num_jobs=4

jobs:
  compile:
    runs-on: ubuntu-24.04
    name: Compile ${{ matrix.arch }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm32]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mold + ccache
        run: |
          sudo apt-get install -y mold ccache
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-android-${{ matrix.arch }}-

      - name: Set up Python + SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons==4.10.1

      - name: Install Perfetto + Swappy
        run: |
          python misc/scripts/install_perfetto.py
          python misc/scripts/install_swappy_android.py

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=${{ github.workspace }}/.ccache
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Compile ${{ matrix.arch }} debug
        run: |
          scons platform=android target=template_debug arch=${{ matrix.arch }} ${{ env.SCONS_FLAGS }}

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Upload template
        uses: actions/upload-artifact@v4
        with:
          name: template-${{ matrix.arch }}
          path: bin/libgodot.android.template_debug.${{ matrix.arch }}.so
          retention-days: 1
          if-no-files-found: error

  assemble-apk:
    needs: compile
    runs-on: ubuntu-24.04
    name: Assemble APK
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('platform/android/java/**/*.gradle*', 'platform/android/java/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Download templates
        uses: actions/download-artifact@v4
        with:
          pattern: template-*
          path: bin/
          merge-multiple: true

      - name: Generate APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates --no-daemon --parallel
          cd ../../..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: bin/android_debug.apk
          if-no-files-found: error
          retention-days: 30
