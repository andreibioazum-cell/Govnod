name: Android Builds

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes

jobs:
  build-android:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor arm64
            cache-name: android-editor-arm64
            target: editor
            scons-flags: >-
              arch=arm64
              production=yes
            gradle-task: generateGodotEditor
            artifact-path: |
              bin/android_editor_builds/**

          - name: Template arm32
            cache-name: android-template-arm32
            target: template_debug
            scons-flags: arch=arm32
            gradle-task: generateGodotTemplates
            artifact-path: |
              bin/**

          - name: Template arm64
            cache-name: android-template-arm64
            target: template_debug
            scons-flags: arch=arm64
            gradle-task: generateGodotTemplates
            artifact-path: |
              bin/**

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons==4.10.1
          scons --version

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: ${{ matrix.cache-name }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.cache-name }}-${{ runner.os }}-

      - name: Download Swappy
        id: swappy_sdk
        shell: bash
        run: |
          if python ./misc/scripts/install_swappy_android.py; then
            echo "SWAPPY_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Swappy installation failed, building without Swappy support."
            echo "SWAPPY_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Perfetto
        id: perfetto_sdk
        shell: bash
        run: |
          if python ./misc/scripts/install_perfetto.py; then
            echo "PROFILER_ENABLED=perfetto" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Perfetto installation failed, building without Perfetto support."
            echo "PROFILER_ENABLED=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile Android binaries
        shell: bash
        run: |
          scons \
            platform=android \
            target=${{ matrix.target }} \
            ${{ env.SCONS_FLAGS }} \
            ${{ matrix.scons-flags }} \
            profiler=${{ steps.perfetto_sdk.outputs.PROFILER_ENABLED }} \
            swappy=${{ steps.swappy_sdk.outputs.SWAPPY_ENABLED }} \
            cache_path=${{ github.workspace }}/.scons_cache \
            redirect_build_objects=no

      - name: Generate Android package
        shell: bash
        run: |
          cd platform/android/java
          ./gradlew ${{ matrix.gradle-task }}
          cd ../../..
          find bin -maxdepth 3 -type f -print

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cache-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 60
