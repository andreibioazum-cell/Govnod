name: Android Debug APK

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes

jobs:
  build-android-arm64-debug:
    runs-on: ubuntu-24.04
    name: Android arm64 debug APK
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons==4.10.1
          scons --version

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: android-arm64-debug-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            android-arm64-debug-${{ runner.os }}-

      - name: Download Swappy
        id: swappy_sdk
        shell: bash
        run: |
          if python ./misc/scripts/install_swappy_android.py; then
            echo "SWAPPY_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Swappy installation failed, building without Swappy support."
            echo "SWAPPY_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Perfetto
        id: perfetto_sdk
        shell: bash
        run: |
          if python ./misc/scripts/install_perfetto.py; then
            echo "PROFILER_ENABLED=perfetto" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Perfetto installation failed, building without Perfetto support."
            echo "PROFILER_ENABLED=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile Android arm64 debug template
        shell: bash
        run: |
          scons \
            platform=android \
            target=template_debug \
            arch=arm64 \
            ${{ env.SCONS_FLAGS }} \
            profiler=${{ steps.perfetto_sdk.outputs.PROFILER_ENABLED }} \
            swappy=${{ steps.swappy_sdk.outputs.SWAPPY_ENABLED }} \
            cache_path=${{ github.workspace }}/.scons_cache \
            redirect_build_objects=no

      - name: Generate debug APK
        shell: bash
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp bin/android_debug.apk artifact/android_debug_arm64.apk
          ls -lh artifact/android_debug_arm64.apk

      - name: Upload APK zip
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug-apk
          path: artifact/android_debug_arm64.apk
          if-no-files-found: error
          retention-days: 60
