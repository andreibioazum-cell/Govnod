name: Android Debug APK

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes

jobs:
  build-android-debug:
    runs-on: ubuntu-24.04
    name: Android debug APK (arm64 + arm32)
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons==4.10.1
          scons --version

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: android-debug-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            android-debug-${{ runner.os }}-

      - name: Compile Android arm64 debug template (ARMv8)
        shell: bash
        run: |
          scons \
            platform=android \
            target=template_debug \
            arch=arm64 \
            ${{ env.SCONS_FLAGS }} \
            cache_path=${{ github.workspace }}/.scons_cache \
            redirect_build_objects=no

      - name: Compile Android arm32 debug template (ARMv7)
        shell: bash
        run: |
          scons \
            platform=android \
            target=template_debug \
            arch=arm32 \
            ${{ env.SCONS_FLAGS }} \
            cache_path=${{ github.workspace }}/.scons_cache \
            redirect_build_objects=no

      - name: Generate debug APK
        shell: bash
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp bin/android_debug.apk artifact/android_debug_arm64_arm32.apk
          ls -lh artifact/android_debug_arm64_arm32.apk

      - name: Upload APK zip
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-arm32-debug-apk
          path: artifact/android_debug_arm64_arm32.apk
          if-no-files-found: error
          retention-days: 60
